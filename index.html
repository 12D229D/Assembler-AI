<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Asistente IA especializado en lenguaje ensamblador x86 con backend multiproveedor LLM.">
    <title>Assembler-AI | Asistente Ensamblador x86</title>
    <style>
        :root { color-scheme: dark; --bg: #08111f; --panel: #101b2e; --panel-2: #16243a; --text: #eef5ff; --muted: #9fb2cc; --brand: #4f8cff; --brand-2: #7c3aed; --danger: #ff6b6b; --border: rgba(255,255,255,.12); }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at top left, rgba(79,140,255,.25), transparent 34rem), linear-gradient(135deg, var(--bg), #05070d); color: var(--text); }
        main { width: min(1040px, 100%); min-height: 100vh; margin: 0 auto; padding: 24px; display: grid; grid-template-rows: auto 1fr auto; gap: 18px; }
        .hero { display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 22px; background: rgba(16,27,46,.82); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 24px 70px rgba(0,0,0,.28); backdrop-filter: blur(18px); }
        h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 3vw, 2.4rem); letter-spacing: -.04em; }
        .hero p { margin: 0; color: var(--muted); max-width: 680px; line-height: 1.6; }
        .badge { white-space: nowrap; padding: 10px 14px; border-radius: 999px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); font-weight: 700; }
        #chat-window { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding: 20px; background: rgba(8,17,31,.72); border: 1px solid var(--border); border-radius: 24px; min-height: 420px; }
        .message { width: fit-content; max-width: min(82%, 760px); padding: 14px 16px; border-radius: 18px; line-height: 1.55; overflow-wrap: anywhere; box-shadow: 0 10px 35px rgba(0,0,0,.18); }
        .user-message { align-self: flex-end; background: linear-gradient(135deg, var(--brand), #2563eb); color: white; border-bottom-right-radius: 6px; }
        .bot-message { align-self: flex-start; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 6px; white-space: pre-wrap; }
        .bot-message code { background: rgba(0,0,0,.28); padding: .16em .38em; border-radius: 6px; font-family: "SFMono-Regular", Consolas, monospace; }
        .status { color: var(--muted); font-size: .95rem; }
        #input-area { display: flex; gap: 12px; padding: 14px; background: rgba(16,27,46,.86); border: 1px solid var(--border); border-radius: 24px; }
        #user-input { flex: 1; min-height: 52px; resize: vertical; padding: 14px 16px; border: 1px solid var(--border); border-radius: 18px; background: rgba(255,255,255,.06); color: var(--text); font: inherit; outline: none; }
        #user-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,140,255,.18); }
        #send-btn { border: 0; border-radius: 18px; padding: 0 22px; color: white; background: linear-gradient(135deg, var(--brand), var(--brand-2)); font-weight: 800; cursor: pointer; }
        #send-btn:disabled { cursor: not-allowed; opacity: .55; }
        .error { color: var(--danger); }
        @media (max-width: 720px) { main { padding: 12px; } .hero { align-items: flex-start; flex-direction: column; } #input-area { flex-direction: column; } #send-btn { min-height: 48px; } .message { max-width: 94%; } }
    </style>
</head>
<body>
    <main>
        <header class="hero">
            <div>
                <h1>Assembler-AI</h1>
                <p>Asistente especializado en ensamblador x86, optimización de bajo nivel y depuración. Backend preparado para Gemini, OpenAI, Anthropic y proveedores compatibles.</p>
            </div>
            <span class="badge">Multi‑LLM</span>
        </header>

        <section id="chat-window" aria-live="polite" aria-label="Conversación con Assembler-AI">
            <div class="message bot-message">¡Hola! Soy tu asistente experto en Lenguaje Ensamblador x86. ¿En qué puedo ayudarte hoy?</div>
        </section>

        <form id="input-area" autocomplete="off">
            <textarea id="user-input" rows="2" maxlength="8000" placeholder="Escribe tu pregunta sobre ASM aquí..." aria-label="Mensaje para el asistente"></textarea>
            <button id="send-btn" type="submit">Enviar</button>
        </form>
    </main>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const inputArea = document.getElementById('input-area');

        function formatBotText(text) {
            const escaped = text.replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
            return escaped
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }

        function addMessage(text, sender, extraClass = '') {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${sender}-message ${extraClass}`.trim();
            messageElement.innerHTML = sender === 'bot' ? formatBotText(text) : '';
            if (sender === 'user') messageElement.innerText = text;
            chatWindow.appendChild(messageElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return messageElement;
        }

        async function handleSend(event) {
            event.preventDefault();
            const messageText = userInput.value.trim();
            if (!messageText || sendBtn.disabled) return;

            addMessage(messageText, 'user');
            userInput.value = '';
            sendBtn.disabled = true;
            const typingIndicator = addMessage('Analizando y generando respuesta...', 'bot', 'status');

            try {
                const response = await fetch('api_handler.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });
                const data = await response.json().catch(() => ({}));
                typingIndicator.remove();

                if (!response.ok || data.error) {
                    addMessage(data.error || `Error del servidor: ${response.status}`, 'bot', 'error');
                    return;
                }

                addMessage(data.reply || 'No se recibió contenido del proveedor LLM.', 'bot');
            } catch (error) {
                typingIndicator.remove();
                addMessage(`Error de conexión: ${error.message}`, 'bot', 'error');
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        inputArea.addEventListener('submit', handleSend);
        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) handleSend(event);
        });
    </script>
</body>
</html>
